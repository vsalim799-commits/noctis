<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noctis — aperçu 3D de la vallée simulée</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; font-family: system-ui, sans-serif; }
  #hud { position: absolute; left: 14px; top: 12px; color: #eef; font-size: 13px; text-shadow: 0 1px 2px #000; line-height: 1.45; pointer-events: none; }
  #hud b { font-size: 15px; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<div id="hud"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Debug/preview renderer for the simulation data. This is NOT the game's renderer: the game renders
// in Unreal Engine 5 with sculpted models, skin materials and animation. Shapes here are placeholders
// driven by real simulated positions, headings, sizes and foot contacts.
const params = new URLSearchParams(location.search);
const dataUrl = params.get('data') || '../../Output/preview/preview_data.json';
const D = await (await fetch(dataUrl)).json();
const [x0, y0, x1, y1] = D.window;
const N = D.n;
const W = x1 - x0;
const EXAG = 1.6; // vertical exaggeration (the Hell Creek floodplain is very flat)
const zRef = Math.min(...D.heights);

// World frame (x east, y north, z up) -> three (x east, y up, z south).
const toV = (x, y, z) => new THREE.Vector3(x - x0 - W / 2, (z - zRef) * EXAG, -(y - y0 - W / 2));
function heightAt(x, y) {
  const fx = (x - x0) / W * (N - 1), fy = (y - y0) / W * (N - 1);
  const i = Math.max(0, Math.min(N - 2, Math.floor(fx))), j = Math.max(0, Math.min(N - 2, Math.floor(fy)));
  const tx = fx - i, ty = fy - j, h = D.heights;
  const a = h[j * N + i], b = h[j * N + i + 1], c = h[(j + 1) * N + i], d = h[(j + 1) * N + i + 1];
  return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
}
function sample(arr, x, y) {
  const i = Math.max(0, Math.min(N - 1, Math.round((x - x0) / W * (N - 1))));
  const j = Math.max(0, Math.min(N - 1, Math.round((y - y0) / W * (N - 1))));
  return arr[j * N + i];
}
let seed = 12345;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const sunDir = new THREE.Vector3(D.sun[0], Math.max(0.12, D.sun[2]), -D.sun[1]).normalize();
const morning = D.sun[2] < 0.35;
const skyTop = new THREE.Color(morning ? 0x8fb2d6 : 0x6f9fd8), skyHorizon = new THREE.Color(morning ? 0xf1d7b4 : 0xcfe0ee);
scene.background = skyHorizon.clone().lerp(skyTop, 0.35);
const fogDensity = Math.max(0.00035, Math.min(0.006, (D.fog || 0) * 0.6 + 0.0006));
scene.fog = new THREE.FogExp2(skyHorizon.clone().lerp(new THREE.Color(0xdfe6ea), 0.5), fogDensity);

// Sky dome.
{
  const g = new THREE.SphereGeometry(6000, 32, 16);
  const m = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: skyTop }, hor: { value: skyHorizon }, sun: { value: sunDir } },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 hor; uniform vec3 sun; varying vec3 vP; void main(){ float t = clamp(vP.y*1.6,0.0,1.0); vec3 c = mix(hor, top, t); float s = pow(max(dot(vP, sun),0.0), 400.0); float halo = pow(max(dot(vP, sun),0.0), 8.0)*0.35; gl_FragColor = vec4(c + vec3(1.0,0.9,0.7)*(s*2.0+halo), 1.0); }' });
  scene.add(new THREE.Mesh(g, m));
}

const hemi = new THREE.HemisphereLight(0xcfe0ff, 0x4a5a32, 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(morning ? 0xffe1b8 : 0xfff3e0, morning ? 2.4 : 3.0);
sun.position.copy(sunDir.clone().multiplyScalar(1200));
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera; sc.left = -800; sc.right = 800; sc.top = 800; sc.bottom = -800; sc.near = 10; sc.far = 3000;
sun.shadow.bias = -0.0004;
scene.add(sun);

// ---------------------------------------------------------------- Terrain
const habitatColors = [
  [0.34, 0.33, 0.28], [0.40, 0.34, 0.25], [0.72, 0.64, 0.48], [0.30, 0.30, 0.26], [0.26, 0.30, 0.18], [0.20, 0.28, 0.13],
  [0.36, 0.44, 0.17], [0.27, 0.35, 0.15], [0.20, 0.26, 0.16], [0.55, 0.43, 0.30], [0.80, 0.68, 0.50], [0.72, 0.62, 0.48], [0.38, 0.36, 0.30], [0.52, 0.50, 0.32]];
{
  const geo = new THREE.PlaneGeometry(W, W, N - 1, N - 1);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  for (let k = 0; k < pos.count; k++) {
    const vx = pos.getX(k), vz = pos.getZ(k);
    const wx = vx + W / 2 + x0, wy = -vz + W / 2 + y0;
    const i = Math.round((wx - x0) / W * (N - 1)), j = Math.round((wy - y0) / W * (N - 1));
    const idx = Math.max(0, Math.min(N - 1, j)) * N + Math.max(0, Math.min(N - 1, i));
    pos.setY(k, (D.heights[idx] - zRef) * EXAG);
    let c = habitatColors[D.habitat[idx]] || [0.4, 0.4, 0.3];
    const wet = D.moisture[idx], trail = D.trail[idx], fern = D.fern[idx];
    const n = (rnd() - 0.5) * 0.06;
    let r = c[0] + n, g = c[1] + n, b = c[2] + n * 0.5;
    // Fern ground cover greens the open floodplain; wet soils darken; animal trails are bare silt.
    r = r * (1 - 0.25 * fern) + 0.22 * 0.25 * fern; g = g * (1 - 0.25 * fern) + 0.40 * 0.25 * fern; b = b * (1 - 0.25 * fern) + 0.12 * 0.25 * fern;
    const dark = 1 - 0.35 * Math.max(0, wet - 0.5);
    r *= dark; g *= dark; b *= dark;
    if (trail > 0.15) { const t = Math.min(1, (trail - 0.15) * 1.6); r = r * (1 - t) + 0.46 * t; g = g * (1 - t) + 0.40 * t; b = b * (1 - t) + 0.31 * t; }
    colors[k * 3] = r; colors[k * 3 + 1] = g; colors[k * 3 + 2] = b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 }));
  terrain.receiveShadow = true;
  scene.add(terrain);
}

// ---------------------------------------------------------------- Water surface
{
  const geo = new THREE.PlaneGeometry(W, W, N - 1, N - 1);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const keep = new Uint8Array(pos.count);
  for (let k = 0; k < pos.count; k++) {
    const vx = pos.getX(k), vz = pos.getZ(k);
    const wx = vx + W / 2 + x0, wy = -vz + W / 2 + y0;
    const i = Math.round((wx - x0) / W * (N - 1)), j = Math.round((wy - y0) / W * (N - 1));
    const idx = Math.max(0, Math.min(N - 1, j)) * N + Math.max(0, Math.min(N - 1, i));
    const depth = D.water[idx];
    keep[k] = depth > 0.02 ? 1 : 0;
    pos.setY(k, (D.heights[idx] + depth - zRef) * EXAG + 0.05);
  }
  const index = geo.index.array, kept = [];
  for (let t = 0; t < index.length; t += 3) {
    if (keep[index[t]] || keep[index[t + 1]] || keep[index[t + 2]]) kept.push(index[t], index[t + 1], index[t + 2]);
  }
  geo.setIndex(kept);
  geo.computeVertexNormals();
  const water = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ color: 0x3d5a52, roughness: 0.08, metalness: 0.0, transparent: true, opacity: 0.82,
    clearcoat: 1.0, clearcoatRoughness: 0.05, envMapIntensity: 1.0 }));
  water.receiveShadow = true;
  scene.add(water);
}

// ---------------------------------------------------------------- Vegetation (instanced, density from the simulation)
function instanced(geometry, material, count) {
  const m = new THREE.InstancedMesh(geometry, material, count);
  m.castShadow = true; m.receiveShadow = true; return m;
}
const dummy = new THREE.Object3D();
{
  const conifers = [], broadleaf = [], ferns = [], horsetails = [];
  const step = W / (N - 1);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const idx = j * N + i;
    if (D.water[idx] > 0.05) continue;
    const wx = x0 + i * step, wy = y0 + j * step;
    const pc = D.conifer[idx] * 0.55, pa = D.angio[idx] * 0.55, pf = D.fern[idx], ph = D.horsetail[idx];
    if (rnd() < pc) conifers.push([wx + (rnd() - 0.5) * step, wy + (rnd() - 0.5) * step, 14 + rnd() * 18]);
    if (rnd() < pa) broadleaf.push([wx + (rnd() - 0.5) * step, wy + (rnd() - 0.5) * step, 9 + rnd() * 12]);
    for (let f = 0; f < Math.round(pf * 3); f++) ferns.push([wx + (rnd() - 0.5) * step, wy + (rnd() - 0.5) * step, 0.5 + rnd() * 0.8]);
    if (rnd() < ph * 0.8) horsetails.push([wx + (rnd() - 0.5) * step, wy + (rnd() - 0.5) * step, 0.6 + rnd() * 0.9]);
  }
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3a2c, roughness: 1 });
  const conMat = new THREE.MeshStandardMaterial({ color: 0x2c4a30, roughness: 0.9, flatShading: true });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x3f6a2c, roughness: 0.85, flatShading: true });
  const fernMat = new THREE.MeshStandardMaterial({ color: 0x55782c, roughness: 0.9, flatShading: true });
  const horseMat = new THREE.MeshStandardMaterial({ color: 0x6d7f3a, roughness: 0.9 });
  const place = (mesh, list, build) => { list.forEach((t, k) => { build(t); dummy.updateMatrix(); mesh.setMatrixAt(k, dummy.matrix); }); mesh.instanceMatrix.needsUpdate = true; scene.add(mesh); };
  // Taxodiaceous / cupressaceous conifers: tall narrow crowns.
  const conCrown = instanced(new THREE.ConeGeometry(1, 1, 7), conMat, conifers.length);
  const conTrunk = instanced(new THREE.CylinderGeometry(0.5, 0.7, 1, 6), trunkMat, conifers.length);
  place(conCrown, conifers, ([x, y, h]) => { dummy.position.copy(toV(x, y, heightAt(x, y))).add(new THREE.Vector3(0, h * 0.62 * EXAG, 0)); dummy.scale.set(h * 0.16, h * 0.8 * EXAG, h * 0.16); dummy.rotation.set(0, rnd() * 6, 0); });
  place(conTrunk, conifers, ([x, y, h]) => { dummy.position.copy(toV(x, y, heightAt(x, y))).add(new THREE.Vector3(0, h * 0.2 * EXAG, 0)); dummy.scale.set(h * 0.03, h * 0.4 * EXAG, h * 0.03); });
  // Angiosperm trees: rounded crowns on trunks.
  const leafCrown = instanced(new THREE.IcosahedronGeometry(1, 1), leafMat, broadleaf.length);
  const leafTrunk = instanced(new THREE.CylinderGeometry(0.5, 0.7, 1, 6), trunkMat, broadleaf.length);
  place(leafCrown, broadleaf, ([x, y, h]) => { dummy.position.copy(toV(x, y, heightAt(x, y))).add(new THREE.Vector3(0, h * 0.72 * EXAG, 0)); dummy.scale.set(h * 0.33, h * 0.26 * EXAG, h * 0.33); dummy.rotation.set(rnd(), rnd() * 6, rnd()); });
  place(leafTrunk, broadleaf, ([x, y, h]) => { dummy.position.copy(toV(x, y, heightAt(x, y))).add(new THREE.Vector3(0, h * 0.28 * EXAG, 0)); dummy.scale.set(h * 0.04, h * 0.56 * EXAG, h * 0.04); });
  // Fern ground cover and horsetail stands (no grasses: grasslands did not exist in the Hell Creek ecosystem).
  const fernMesh = instanced(new THREE.ConeGeometry(1, 1, 5), fernMat, ferns.length);
  place(fernMesh, ferns, ([x, y, h]) => { dummy.position.copy(toV(x, y, heightAt(x, y))).add(new THREE.Vector3(0, h * 0.3 * EXAG, 0)); dummy.scale.set(h * 1.1, h * 0.6 * EXAG, h * 1.1); dummy.rotation.set(Math.PI, rnd() * 6, 0); });
  const horseMesh = instanced(new THREE.CylinderGeometry(0.04, 0.06, 1, 4), horseMat, horsetails.length);
  place(horseMesh, horsetails, ([x, y, h]) => { dummy.position.copy(toV(x, y, heightAt(x, y))).add(new THREE.Vector3(0, h * 0.5 * EXAG, 0)); dummy.scale.set(4, h * EXAG, 4); });
}

// ---------------------------------------------------------------- Animals (placeholder shapes, real simulated state)
const palette = { biped_large_theropod: 0x7a5236, biped_small_theropod: 0x8a6a4a, biped_ornithomimid: 0x9a8a6a, biped_oviraptorosaur: 0x6a5a6a,
  biped_small_ornithischian: 0x7a7a52, biped_pachycephalosaur: 0x8a6a52, facultative_quadruped_hadrosaur: 0x6f7356, quadruped_ceratopsian: 0x7a6650,
  quadruped_ankylosaur: 0x5d5a4c, quadruped_crocodylian: 0x3f4a36, quadruped_small_mammal: 0x5a4a3a, quadruped_azhdarchid: 0x8a8070, aquatic_reptile: 0x4a5a46 };
const skin = {};
const matFor = (plan) => skin[plan] || (skin[plan] = new THREE.MeshStandardMaterial({ color: palette[plan] || 0x777766, roughness: 0.75 }));
const animals = new THREE.Group();
scene.add(animals);
for (const c of D.creatures) {
  const sp = D.species[c.s];
  const plan = sp.plan;
  const mat = matFor(plan);
  const L = c.len, hip = c.hip;
  const biped = plan.startsWith('biped');
  const root = new THREE.Group();
  root.position.copy(toV(c.x, c.y, c.z));
  root.rotation.y = c.h; // heading: 0 = east
  // Body: torso ellipsoid centred over the hips, tail tapering behind, neck and head forward.
  const torsoLen = L * (biped ? 0.34 : 0.42), torsoR = L * (biped ? 0.085 : 0.11);
  const torso = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), mat);
  torso.scale.set(torsoLen * 0.5, torsoR * EXAG * (biped ? 1.15 : 1.0), torsoR);
  const bodyY = (hip + (biped ? torsoR * 0.3 : torsoR * 0.1)) * EXAG;
  torso.position.set(biped ? L * 0.04 : L * 0.05, bodyY, 0);
  torso.castShadow = true;
  root.add(torso);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(torsoR * 0.75, L * (biped ? 0.48 : 0.35), 10), mat);
  tail.rotation.z = Math.PI / 2;
  tail.position.set(-(torsoLen * 0.5 + L * (biped ? 0.22 : 0.16)), bodyY + torsoR * 0.1 * EXAG, 0);
  tail.castShadow = true;
  root.add(tail);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(torsoR * 0.35, torsoR * 0.55, L * 0.14, 8), mat);
  const headDown = c.posture === 2;
  neck.rotation.z = headDown ? -2.1 : -1.0;
  neck.position.set(torsoLen * 0.5 + L * 0.03, bodyY + (headDown ? -torsoR * 0.6 : torsoR * 0.5) * EXAG, 0);
  neck.castShadow = true;
  root.add(neck);
  const headLen = L * (plan === 'biped_large_theropod' ? 0.12 : (plan === 'quadruped_ceratopsian' ? 0.2 : 0.08));
  const head = new THREE.Mesh(new THREE.BoxGeometry(headLen, torsoR * 0.75 * EXAG, torsoR * 0.6), mat);
  head.position.set(torsoLen * 0.5 + L * 0.1 + headLen * 0.3, bodyY + (headDown ? -hip * 0.75 : torsoR * 1.1) * EXAG, 0);
  head.castShadow = true;
  root.add(head);
  if (plan === 'quadruped_ceratopsian') {
    const frill = new THREE.Mesh(new THREE.CylinderGeometry(torsoR * 1.1, torsoR * 1.1, 0.12, 14, 1, false, 0, Math.PI), mat);
    frill.rotation.set(0, 0, Math.PI / 2);
    frill.position.copy(head.position).add(new THREE.Vector3(-headLen * 0.45, torsoR * 0.5 * EXAG, 0));
    root.add(frill);
  }
  animals.add(root);
  // Legs: from hip/shoulder sockets to the simulated foot positions (planted feet come from the gait model).
  const legMat = mat;
  for (const f of c.feet) {
    const footW = toV(f[0], f[1], f[2]);
    const fore = f[4] === 1;
    const local = new THREE.Vector3(fore ? torsoLen * 0.38 : -torsoLen * 0.05, bodyY - torsoR * 0.4 * EXAG, 0);
    const side = new THREE.Vector3(0, 0, 0);
    const socket = root.localToWorld(local.clone());
    const dir = footW.clone().sub(socket);
    const len = dir.length();
    if (len < 0.01 || len > hip * 3 * EXAG) continue;
    const r = torsoR * (fore ? 0.18 : 0.28);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.6, r, len, 6), legMat);
    leg.position.copy(socket.clone().add(dir.clone().multiplyScalar(0.5)));
    leg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
    leg.castShadow = true;
    animals.add(leg);
    void side;
  }
}

// Footprints (actual simulated impressions, darker when deeper).
{
  const list = D.tracks;
  const mesh = new THREE.InstancedMesh(new THREE.CircleGeometry(0.5, 6), new THREE.MeshStandardMaterial({ color: 0x2e261c, roughness: 1, transparent: true, opacity: 0.85 }), list.length);
  list.forEach((t, k) => {
    dummy.position.copy(toV(t[0], t[1], heightAt(t[0], t[1]))).add(new THREE.Vector3(0, 0.06, 0));
    dummy.rotation.set(-Math.PI / 2, 0, t[3]);
    dummy.scale.set(t[2] * 0.9, t[2] * 0.7, 1);
    dummy.updateMatrix(); mesh.setMatrixAt(k, dummy.matrix);
  });
  mesh.receiveShadow = true;
  scene.add(mesh);
}

// Research vehicle.
{
  const [vx, vy, vz, vh] = D.vehicle;
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(7.5, 3.0 * EXAG, 2.6), new THREE.MeshStandardMaterial({ color: 0xd8d4c8, roughness: 0.5, metalness: 0.2 }));
  body.position.y = 2.2 * EXAG; body.castShadow = true; g.add(body);
  for (const sx of [-2.4, 0, 2.4]) for (const sz of [-1.35, 1.35]) {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.6 * EXAG, 0.6 * EXAG, 0.45, 14), new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.9 }));
    wheel.rotation.x = Math.PI / 2; wheel.position.set(sx, 0.6 * EXAG, sz); wheel.castShadow = true; g.add(wheel);
  }
  g.position.copy(toV(vx, vy, vz)); g.rotation.y = vh;
  scene.add(g);
}

// ---------------------------------------------------------------- Cameras
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.5, 9000);
const controls = new OrbitControls(camera, renderer.domElement);
let focus = new THREE.Vector3();
if (D.creatures.length) {
  const herd = D.creatures.filter(c => D.species[c.s].plan === 'facultative_quadruped_hadrosaur');
  const pick = herd.length ? herd : D.creatures;
  const cx = pick.reduce((s, c) => s + c.x, 0) / pick.length, cy = pick.reduce((s, c) => s + c.y, 0) / pick.length;
  focus = toV(cx, cy, heightAt(cx, cy));
}
const views = {
  overview: () => { camera.position.set(focus.x - 650, 420, focus.z + 650); controls.target.copy(focus); },
  herd: () => { camera.position.set(focus.x - 70, focus.y + 22, focus.z + 55); controls.target.copy(focus.clone().add(new THREE.Vector3(0, 2, 0))); },
  low: () => { camera.position.set(focus.x - 140, focus.y + 6, focus.z + 30); controls.target.copy(focus.clone().add(new THREE.Vector3(0, 4, 0))); },
  river: () => { camera.position.set(focus.x + 260, focus.y + 90, focus.z - 260); controls.target.copy(focus); },
};
(views[params.get('view')] || views.overview)();
controls.update();

const hud = document.getElementById('hud');
const counts = {};
D.creatures.forEach(c => { const n = D.species[c.s].name; counts[n] = (counts[n] || 0) + 1; });
hud.innerHTML = `<b>Noctis — vallée simulée (Hell Creek, Maastrichtien)</b><br>${D.time} · ${D.weather}<br>` +
  Object.entries(counts).map(([k, v]) => `<i>${k}</i> × ${v}`).join('<br>') +
  `<br><span style="opacity:.75">Aperçu de débogage WebGL : positions, pas et végétation issus de la simulation ; formes provisoires (le rendu du jeu est fait dans Unreal Engine 5).</span>`;

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
// `?still=1` renders a single frame (headless capture with a software rasterizer is too slow for a loop).
const still = params.get('still') === '1';
function frame() { controls.update(); renderer.render(scene, camera); if (!still) requestAnimationFrame(frame); }
frame();
window.__ready = true;
</script>
</body>
</html>
