; Noctis - surcharges de scalabilité.
; Les niveaux suivent la convention Unreal : @0 = Low, @1 = Medium, @2 = High, @3 = Epic, @Cine = Cinématique.
; Les valeurs Unreal par défaut (BaseScalability.ini) restent héritées ; seuls les points propres à Noctis
; sont ajustés ici. AUCUNE de ces valeurs n'a été mesurée : ce sont des hypothèses de départ à valider
; avec la checklist de Docs/UE5_INTEGRATION.md (stat unit, stat gpu, Unreal Insights).
;
; Cibles visées (à confirmer sur machine réelle, 1080p sauf mention) :
;   Low    : GTX 1660 / RX 5600 XT, 1080p TSR 50 %,  >= 30 i/s, sans Lumen, ombres classiques
;   Medium : RTX 2060 / RX 6600,    1080p TSR 67 %,  >= 45 i/s, Lumen bas, VSM
;   High   : RTX 3070 / RX 6800,    1440p TSR 67 %,  >= 60 i/s, Lumen, VSM, brouillard volumétrique
;   Epic   : RTX 4080 / RX 7900 XT, 4K TSR 50-67 %,  >= 60 i/s, Lumen haute qualité
; Budget CPU de la simulation (thread de jeu non bloqué ; tâche de simulation en parallèle) :
;   le job d'une trame (en moyenne 1 à 2 pas de 50 ms simulés) doit rester sous ~8 ms (Low/Medium) et ~5 ms (High/Epic).
;   Mesuré hors Unreal (noctis_bench, gcc 13, 4 coeurs partagés) : 254 individus à PopulationScale=1 ; coût net par
;   animal et par pas ~0,12 ms en détail complet (Full), ~0,002 ms (Near), ~0,0004 ms (Far). Le budget est donc fixé par
;   le nombre d'animaux en détail complet autour des observateurs (~40 animaux Full = ~5 ms par pas), pas par la population.
;
; Variables propres à Noctis (enregistrées par le module Noctis) :
;   noctis.Creatures.MaxActors          nombre max d'acteurs squelettiques de créatures (pool)
;   noctis.Creatures.ActorRadiusM       rayon (m) autour de la caméra où les animaux sont des acteurs complets
;   noctis.Creatures.FarInstanceRadiusM rayon (m) des imposteurs instanciés (animaux lointains)
;   noctis.Vegetation.Interactors       nombre d'animaux transmis aux matériaux de végétation (courbure)

[ViewDistanceQuality@0]
noctis.Creatures.MaxActors=32
noctis.Creatures.ActorRadiusM=250
noctis.Creatures.FarInstanceRadiusM=1200

[ViewDistanceQuality@1]
noctis.Creatures.MaxActors=64
noctis.Creatures.ActorRadiusM=350
noctis.Creatures.FarInstanceRadiusM=1800

[ViewDistanceQuality@2]
noctis.Creatures.MaxActors=96
noctis.Creatures.ActorRadiusM=450
noctis.Creatures.FarInstanceRadiusM=2500

[ViewDistanceQuality@3]
noctis.Creatures.MaxActors=160
noctis.Creatures.ActorRadiusM=600
noctis.Creatures.FarInstanceRadiusM=4000

[ViewDistanceQuality@Cine]
noctis.Creatures.MaxActors=256
noctis.Creatures.ActorRadiusM=900
noctis.Creatures.FarInstanceRadiusM=6000

[FoliageQuality@0]
noctis.Vegetation.Interactors=4

[FoliageQuality@1]
noctis.Vegetation.Interactors=8

[FoliageQuality@2]
noctis.Vegetation.Interactors=16

[FoliageQuality@3]
noctis.Vegetation.Interactors=32

[FoliageQuality@Cine]
noctis.Vegetation.Interactors=32

[ShadowQuality@0]
; Low : ombres classiques (CSM) - les VSM coûtent trop sur une forêt riveraine dense.
r.Shadow.Virtual.Enable=0
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=0.6

[ShadowQuality@1]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.0

[ShadowQuality@2]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.0

[ShadowQuality@3]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5

[EffectsQuality@0]
; Brouillard de vallée : simple brouillard exponentiel à deux couches (pas de volumétrique).
r.VolumetricFog=0
r.VolumetricCloud.ViewRaySampleMaxCount=256

[EffectsQuality@1]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64
r.VolumetricCloud.ViewRaySampleMaxCount=384

[EffectsQuality@2]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=96
r.VolumetricCloud.ViewRaySampleMaxCount=512

[EffectsQuality@3]
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=128
r.VolumetricCloud.ViewRaySampleMaxCount=768

[GlobalIlluminationQuality@0]
; Low : pas de Lumen (hérité de BaseScalability) ; la lumière du ciel reste dynamique.
r.Lumen.DiffuseIndirect.Allow=0

[GlobalIlluminationQuality@1]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=32

[ReflectionQuality@0]
r.Lumen.Reflections.Allow=0
