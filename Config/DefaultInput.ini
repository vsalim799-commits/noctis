; Noctis - entrées (Enhanced Input).
; Les Input Actions (IA_*) et les Input Mapping Contexts (IMC_*) sont des assets créés par
; Content/Python/setup_project.py dans /Game/Input. Les classes C++ (ANoctisResearcherCharacter,
; ANoctisResearchVehiclePawn, ANoctisDronePawn) les lisent depuis UNoctisSettings ou depuis leurs
; propriétés (surchargées dans les Blueprints).
;
; Contextes (priorité) :
;   IMC_Researcher (0)  marcher, regarder, s'accroupir, parler, lampe frontale, entrer dans le véhicule
;   IMC_Vehicle    (0)  accélérateur, frein, direction, moteur, générateur, phares, sortir
;   IMC_Drone      (0)  translation, altitude, cap, modes (orbite, suivi, retour), atterrir
;   IMC_Tools      (1)  appareil photo, jumelles, micro, capteurs, zoom, déclencheur, carnet
;   IMC_UI         (2)  carnet de terrain, carte, spectrogramme, hypothèses, rapports, pause, temps

