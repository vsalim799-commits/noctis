; Noctis - configuration moteur (UE 5.4 / 5.5).
; Toutes les valeurs ci-dessous sont des points de départ : elles n'ont PAS été mesurées sur machine réelle
; (aucun moteur Unreal n'était disponible lors de l'écriture). Voir Docs/UE5_INTEGRATION.md, section
; "Checklist de test", pour les mesures à faire et les cibles par niveau de scalabilité.

[/Script/EngineSettings.GameMapsSettings]
; La carte est créée par Content/Python/setup_project.py (World Partition activé, "Open World").
EditorStartupMap=/Game/Maps/HellCreek.HellCreek
GameDefaultMap=/Game/Maps/HellCreek.HellCreek
GlobalDefaultGameMode=/Script/Noctis.NoctisGameMode

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.RendererSettings]
; --- Éclairage global et réflexions : Lumen (logiciel par défaut ; le matériel est optionnel) ---
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=1
r.Lumen.HardwareRayTracing=False
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
; --- Ombres : Virtual Shadow Maps ---
; r.Shadow.Virtual.Enable n'est volontairement PAS fixé ici : une valeur de [RendererSettings] (priorité
; SetByProjectSetting) masquerait la scalabilité (SetByScalability, plus faible) et ShadowQuality@0 ne pourrait
; plus revenir aux cascades classiques. Les VSM sont la valeur par défaut d'UE 5 ; DefaultScalability.ini décide.
; --- Géométrie : Nanite (terrain rocheux, troncs, rochers ; les créatures restent en maillages squelettiques) ---
r.Nanite.ProjectEnabled=True
; --- Ciel, brouillard, nuages : pilotés par ANoctisEnvironmentController ---
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
; --- Exposition : unités physiques (lux) pour suivre l'éclairement simulé, de la nuit sans lune au plein soleil ---
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
; --- Textures virtuelles (RVT du sol : pistes, piétinement, humidité) ---
r.VirtualTextures=True
r.VirtualTexturedLightmaps=False
; --- Divers ---
r.AntiAliasingMethod=4
r.CustomDepth=3
r.SkinCache.CompileShaders=True
r.RayTracing=False
r.Substrate=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
AudioSampleRate=48000
AudioCallbackBufferFrameSize=1024
AudioNumBuffersToEnqueue=2
AudioMaxChannels=96
AudioNumSourceWorkers=4

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-981.000000
; Sous-pas physiques : stabilité du véhicule Chaos 6x6 sur sol mou (pression des pneus calculée par le coeur).
bSubstepping=True
MaxSubstepDeltaTime=0.008333
MaxSubsteps=8
bTickPhysicsAsync=False

[/Script/Engine.CollisionProfile]
; Canal de requête utilisé par les outils de recherche (appareil photo, jumelles, télémètre) pour viser les animaux.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="NoctisObservation")
+Profiles=(Name="NoctisCreature",CollisionEnabled=QueryOnly,bCanModify=False,ObjectTypeName="Pawn",CustomResponses=((Channel="Visibility",Response=ECR_Block),(Channel="Camera",Response=ECR_Ignore),(Channel="NoctisObservation",Response=ECR_Block),(Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore)),HelpMessage="Animal simulé par NoctisCore : visible des outils d'observation, aucune réponse physique (le coeur gère les contacts).")

[/Script/Engine.AudioSettings]
DefaultSoundClassName=/Game/Audio/Classes/SC_Noctis_Master.SC_Noctis_Master
DefaultMediaSoundClassName=/Game/Audio/Classes/SC_Noctis_Master.SC_Noctis_Master
DefaultBaseSoundMix=None
VoiPSoundClass=None
bEnableAudioMixer=True

[/Script/Engine.Engine]
bSmoothFrameRate=False
bUseFixedFrameRate=False

[/Script/Engine.GarbageCollectionSettings]
; Les acteurs de créatures sont recyclés (pool) : peu d'objets créés/détruits à l'exécution.
gc.TimeBetweenPurgingPendingKillObjects=60

[ConsoleVariables]
; World Partition : la vallée fait 8 x 8 km ; le streaming ne doit jamais bloquer le jeu (VERIFY nom des cvars en 5.5).
wp.Runtime.BlockOnSlowStreaming=0
wp.Runtime.HLOD=1
; Animation : mise à jour et évaluation parallèles (les AnimInstance Noctis sont thread-safe).
a.ParallelAnimUpdate=1
a.ParallelAnimEvaluation=1
; NE PAS mettre ici les variables que DefaultScalability.ini règle par niveau (r.VolumetricFog*, noctis.Creatures.*,
; noctis.Vegetation.Interactors) : [ConsoleVariables] s'applique avec la priorité SetBySystemSettingsIni, plus forte que
; SetByScalability, et figerait ces valeurs quel que soit le niveau choisi (avertissement « ... was ignored as it is
; lower priority »). Leurs valeurs par défaut (niveau High) sont celles des constructeurs C++ et de BaseScalability.ini.

; ---------------------------------------------------------------------------------------------
; Réglages du projet Noctis (Project Settings > Game > Noctis) - classe UNoctisSettings (config=Engine).
; ---------------------------------------------------------------------------------------------
[/Script/Noctis.NoctisSettings]
; Racine des données scientifiques. Vide = <Projet>/Data (éditeur et build packagé, voir RuntimeDependencies
; dans Noctis.Build.cs), puis repli sur Content/NoctisData.
DataRootOverride=
EnvironmentId=hell_creek
ProfileId=standard
Seed=7
; 0 = laisser le coeur choisir ; sous Unreal le planificateur ParallelFor utilise les workers du moteur.
Threads=0
PopulationScale=1.0
HeightSamples=2017
MaterialCells=1024
VegetationCellM=16.0
StartDayOfYear=140.0
StartHour=5.0
; Pas fixe de simulation (s) en temps réel, et pas maximal quand le temps est accéléré.
FixedStepSeconds=0.05
CoarseStepSeconds=2.0
FullDetailMaxTimeScale=8.0
MaxStepsPerJob=64
MaxBacklogSeconds=0.25
bAsyncSimulation=True
bUseParallelFor=True
; Décalage appliqué entre le repère du coeur (x est, y nord, z haut, m) et le monde UE (cm).
WorldOffsetCm=(X=0.000000,Y=0.000000,Z=0.000000)
bAutoSpawnPresentationActors=True
AuxDataIntervalSeconds=1.0
AuxDataRadiusM=600.0
; Audio : niveau SPL (dB) correspondant à la pleine échelle numérique (0 dBFS).
AudioFullScaleDbSpl=110.0
MaxProceduralCalls=12
FootstepMaxDistanceM=120.0
